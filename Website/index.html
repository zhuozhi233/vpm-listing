<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VPM Listing</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --panel: rgba(255,255,255,.055);
      --panel-soft: rgba(255,255,255,.035);
      --border: rgba(255,255,255,.12);
      --border-strong: rgba(255,255,255,.2);
      --text: #f4f5f7;
      --muted: #a9adb7;
      --accent: #7c9cff;
      --accent-hover: #95adff;
      font-family: "Segoe UI", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(124,156,255,.12), transparent 34rem),
        radial-gradient(circle at bottom right, rgba(88,101,242,.08), transparent 36rem),
        var(--bg);
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { color: var(--accent-hover); text-decoration: underline; }

    .page {
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 32px;
    }

    .hero,
    .section {
      border: 1px solid var(--border);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255,255,255,.065), rgba(255,255,255,.04));
      box-shadow: 0 22px 60px rgba(0,0,0,.28);
    }

    .hero { padding: 30px; }
    .section { margin-top: 24px; padding: 22px; }

    .badge {
      display: inline-flex;
      align-items: center;
      height: 30px;
      padding: 0 12px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: rgba(255,255,255,.035);
      font-size: 13px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 5vw, 52px);
      line-height: 1.05;
      letter-spacing: -.04em;
    }

    h2 {
      margin: 0 0 16px;
      font-size: 22px;
      letter-spacing: -.02em;
    }

    .published {
      margin-top: 14px;
      color: var(--muted);
      font-size: 15px;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 10px;
      align-items: center;
      margin-top: 26px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: rgba(0,0,0,.16);
    }

    .url-field,
    .search {
      min-width: 0;
      height: 42px;
      padding: 0 14px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      background: rgba(255,255,255,.055);
      outline: none;
      font: inherit;
    }

    .search {
      width: min(320px, 100%);
      margin-bottom: 14px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 15px;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      color: var(--text);
      background: rgba(255,255,255,.07);
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }

    .button:hover {
      background: rgba(255,255,255,.1);
      text-decoration: none;
    }

    .button.primary {
      border-color: rgba(124,156,255,.55);
      background: rgba(124,156,255,.22);
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .card {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel-soft);
    }

    .card-title {
      margin: 0;
      font-size: 17px;
      font-weight: 650;
    }

    .card-desc,
    .card-url,
    .footer-note {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    .card-desc { margin: 8px 0 0; }
    .card-url { margin: 8px 0 0; word-break: break-all; opacity: .82; }
    .footer-note { margin-top: 18px; text-align: center; font-size: 13px; }

    .card-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      display: none;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #20232b;
      color: var(--text);
      box-shadow: 0 16px 40px rgba(0,0,0,.32);
      font-size: 14px;
    }

    .toast.show { display: block; }

    [hidden] { display: none !important; }

    @media (max-width: 720px) {
      .page { width: min(100% - 20px, 1080px); padding-top: 10px; }
      .hero, .section { padding: 18px; border-radius: 18px; }
      .actions, .card { grid-template-columns: 1fr; }
      .button { width: 100%; }
      .card-actions { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="badge">VPM Listing</div>
      <h1 id="listingName">VPM Listing</h1>
      <div id="authorLine" class="published"></div>

      <div class="actions">
        <input id="listingUrl" class="url-field" readonly aria-label="Listing URL" />
        <button id="addRepo" class="button primary">Add to VCC</button>
        <button id="copyUrl" class="button">Copy</button>
      </div>
    </section>

    <section id="packagesSection" class="section" hidden>
      <h2>Packages</h2>
      <input id="searchInput" class="search" type="search" placeholder="Search packages..." />
      <div id="packagesList" class="list"></div>
    </section>

    <section id="reposSection" class="section" hidden>
      <h2>GitHub Repositories</h2>
      <div id="reposList" class="list"></div>
    </section>

    <div class="footer-note">添加到 VCC 后，可以在项目中安装这里发布的包。</div>
  </main>

  <div id="toast" class="toast">已复制 Listing URL</div>

  <script>
    const $ = (id) => document.getElementById(id);

    function showToast(text) {
      $('toast').textContent = text;
      $('toast').classList.add('show');
      clearTimeout(showToast.timer);
      showToast.timer = setTimeout(() => $('toast').classList.remove('show'), 1300);
    }

    function createButton(text, href, primary) {
      const a = document.createElement('a');
      a.className = primary ? 'button primary' : 'button';
      a.textContent = text;
      a.href = href;
      a.target = '_blank';
      a.rel = 'noopener';
      return a;
    }

    function renderPackage(pkg, listingUrl) {
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div>
          <h3 class="card-title"></h3>
          <p class="card-desc"></p>
        </div>
        <div class="card-actions"></div>
      `;

      card.querySelector('.card-title').textContent = pkg.displayName || pkg.name;
      card.querySelector('.card-desc').textContent = pkg.description || '';
      card.querySelector('.card-actions').append(
        createButton('Add to VCC', `vcc://vpm/addRepo?url=${encodeURIComponent(listingUrl)}`, true)
      );
      return card;
    }

    function renderRepo(repo) {
      const repoName = repo.split('/').pop();
      const repoUrl = `https://github.com/${repo}`;
      const card = document.createElement('article');
      card.className = 'card';
      card.innerHTML = `
        <div>
          <h3 class="card-title"></h3>
          <p class="card-desc"></p>
          <div class="card-url"></div>
        </div>
        <div class="card-actions"></div>
      `;

      card.querySelector('.card-title').textContent = repoName;
      card.querySelector('.card-url').textContent = repoUrl;
      card.querySelector('.card-actions').append(createButton('Open on GitHub', repoUrl, true));

      fetch(`https://api.github.com/repos/${repo}`)
        .then((res) => res.json())
        .then((data) => card.querySelector('.card-desc').textContent = data.description || '')
        .catch(() => {});

      return card;
    }

    function renderPackages(packages, listingUrl) {
      $('packagesSection').hidden = !packages.length;
      $('packagesList').replaceChildren(...packages.map((pkg) => renderPackage(pkg, listingUrl)));

      $('searchInput').addEventListener('input', () => {
        const keyword = $('searchInput').value.trim().toLowerCase();
        const results = packages.filter((pkg) => `${pkg.displayName || ''} ${pkg.name || ''} ${pkg.description || ''}`.toLowerCase().includes(keyword));
        $('packagesList').replaceChildren(...results.map((pkg) => renderPackage(pkg, listingUrl)));
      });
    }

    function renderRepos(repos) {
      $('reposSection').hidden = !repos.length;
      $('reposList').replaceChildren(...repos.map(renderRepo));
    }

    fetch('./source.json')
      .then((res) => res.json())
      .then((listing) => {
        document.title = listing.name;
        $('listingName').textContent = listing.name;
        $('listingUrl').value = listing.url;
        $('authorLine').innerHTML = `Published by <a href="${listing.author.url}" target="_blank" rel="noopener"></a>`;
        $('authorLine').querySelector('a').textContent = listing.author.name;

        $('addRepo').onclick = () => location.href = `vcc://vpm/addRepo?url=${encodeURIComponent(listing.url)}`;
        $('copyUrl').onclick = () => navigator.clipboard.writeText(listing.url).then(() => showToast('已复制 Listing URL'));

        renderPackages(listing.packages, listing.url);
        renderRepos(listing.githubRepos);
      });
  </script>
</body>
</html>
